lang: "zh-CN"
app:
  web-client: 1  # 1:启用 0:禁用
  register: false #是否开启注册
  register-status: 1 # 注册用户默认状态 1:启用 2:禁用
  captcha-threshold: 3 #   <0:disabled, 0 always, >0:enabled
  ban-threshold: 0 # 0:disabled, >0:enabled
  show-swagger: 0 # 1:启用 0:禁用
  token-expire: 24h
  web-sso: true #web auth sso
  disable-pwd-login: false #禁用密码登录
  # 仅允许本地开发临时开启；生产环境必须保持 false，安全配置缺失时进程拒绝启动。
  allow-insecure-development: false

admin:
  title: "蓝鲸银河 · 管理后台"
  hello-file: "./conf/admin/hello.html"  #优先使用file
  hello: ""
  # ID Server and Relay Server ports https://github.com/lejianwen/rustdesk-api/issues/257
  id-server-port: 21116  # ID Server port (for server cmd)
  relay-server-port: 21117 # ID Server port (for server cmd)
gin:
  api-addr: "0.0.0.0:21114"
  mode: "release" #release,debug,test
  resources-path: 'resources'  #对外静态文件目录
  trust-proxy: ""
gorm:
  type: "sqlite"
  max-idle-conns: 10
  max-open-conns: 100
  # 商用环境必须保持 false，并在启动应用前运行经审核的显式迁移。
  # 仅本地临时数据库可显式改为 true 使用 GORM AutoMigrate。
  auto-migrate: false
mysql:
  username: ""
  password: ""
  addr: ""
  dbname: ""
  tls: "false" # true / false / skip-verify / custom

postgresql:
  host: "127.0.0.1"
  port: "5432"
  user: ""
  password: ""
  dbname: "postgres"
  sslmode: "verify-full" # disable, require, verify-ca, verify-full
  ssl-root-cert: "" # 可选：Supabase Dashboard 下载的数据库 CA PEM 路径
  time-zone: "Asia/Shanghai" # Time zone for PostgreSQL connection
  schema: "yinhe_app" # 私有应用 schema；禁止使用 Supabase Data API 暴露 schema
  pool-mode: "direct" # direct / session；禁止 transaction pooler
  jit-access: false # 仅限 Supabase 短期令牌；令牌只能通过环境变量/密钥管理注入

rustdesk:
  id-server: "192.168.1.66:21116"
  relay-server: "192.168.1.66:21117"
  api-server: "http://127.0.0.1:21114"
  key: ""
  key-file: "/data/id_ed25519.pub"
  personal: 1
  webclient-magic-queryonline: 0
  ws-host: ""  #eg: wss://192.168.1.3:4443
logger:
  path: "./runtime/log.txt"
  level: "info" #trace,debug,info,warn,error,fatal
  report-caller: true
proxy:
  enable: false
  host: "http://127.0.0.1:1080"
jwt:
  key: "" # 生产环境通过 RUSTDESK_API_JWT_KEY 注入，至少32字符
  expire-duration: 24h
mfa:
  enabled: false # 开启后允许用户绑定 TOTP；生产环境必须注入独立 encryption-key 或使用强 JWT key
  issuer: "蓝鲸银河"
  encryption-key: ""
  required-for-admin: false # 完成受控内测后再开启管理员强制 MFA
passkey:
  enabled: false # 原生 Passkey/WebAuthn；开启前必须配置稳定的 RP ID 与 HTTPS origin
  rp-id: ""
  rp-display-name: "蓝鲸银河"
  origins: []
  require-user-verification: true
sms:
  provider: "aliyun" # mock 仅可在 allow-insecure-development=true 时使用
  code-expire-seconds: 300 # 验证码有效期(秒)
  daily-limit: 10 # 单手机号每日发送上限, <=0不限制
  per-ip-limit: 5 # 单IP每分钟发送上限, <=0不限制
  # 阿里云短信配置, provider 设为 aliyun 时必填 access-key-id/access-key-secret/sign-name/template-code
  # 短信模板需包含 ${code} 变量, 发送的模板参数为 {"code":"123456"}
  access-key-id: ""
  access-key-secret: ""
  sign-name: ""
  template-code: ""
  endpoint: "" # 默认 dysmsapi.aliyuncs.com
ldap:
  enable: false
  url: "ldap://ldap.example.com:389"
  tls-ca-file: ""
  tls-verify: true
  base-dn: "dc=example,dc=com"
  bind-dn: "cn=admin,dc=example,dc=com"
  bind-password: ""
  allow-local-fallback: false

  user:
    base-dn: "ou=users,dc=example,dc=com"
    enable-attr: ""       #The attribute name of the user for enabling, in AD it is "userAccountControl", empty means no enable attribute, all users are enabled
    enable-attr-value: "" # The value of the enable attribute when the user is enabled. If you are using AD, just set random value, it will be ignored.
    filter: "(cn=*)"
    username: "uid"       # The attribute name of the user for usernamem if you are using AD, it should be "sAMAccountName"
    email: "mail"
    first-name: "givenName"
    last-name: "sn"
    sync: false         # If true, the user will be synchronized to the database when the user logs in. If false, the user will be synchronized to the database when the user be created.
    admin-group: "cn=admin,dc=example,dc=com" # The group name of the admin group, if the user is in this group, the user will be an admin.
    allow-group: "cn=users,dc=example,dc=com" # The group name of the users group, if the user is in this group, the user will be an login. 

cache:
  type: "redis"
  redis-addr: "127.0.0.1:6379"
  redis-username: "" # 生产必须使用专用 ACL 用户
  redis-pwd: "" # 推荐通过 RUSTDESK_API_CACHE_REDIS_PWD_FILE 挂载密钥
  redis-db: 0 # 固定 DB 0；使用 key-prefix + ACL pattern 隔离，兼容 Redis Cluster
  redis-tls: true # 生产不可关闭；证书始终校验，不提供 skip-verify
  redis-tls-ca-file: "" # 私有 CA 时填写挂载路径；公有 CA 可使用系统信任库
  redis-tls-server-name: "" # 默认从 redis-addr 推导
  redis-key-prefix: "yinhe:prod:" # ACL key pattern 应与该前缀匹配

metrics:
  enabled: false  # 开启后暴露 /metrics（Prometheus 文本格式）
  # 指标含用户数/设备数/在线数等经营信息，启用时必须配 token（≥16 字符）。
  # 建议经 RUSTDESK_API_METRICS_TOKEN_FILE 以文件注入。
  token: ""
