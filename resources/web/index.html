<!DOCTYPE html>
<html>

<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="/webclient/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="蓝鲸银河企业级安全远程桌面 Web Client。">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="蓝鲸银河">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

    <title>蓝鲸银河</title>
    <link rel="manifest" href="manifest.json">
    <script src="/webclient-config/index.js"></script>
    <script src="ogvjs-1.8.6/ogv.js"></script>
    <!-- Web Client 的 JS 桥主包。此前品牌化改版误删了这一行，导致整个 Web Client
         无法加载，js/src/ 下的全部加固代码也从未进入执行路径。
         注意：当前 vite 配置不再产出 vendor chunk（见 js/vite.config.js），
         因此不要恢复上游的 <link rel="modulepreload" href="js/dist/vendor.js">。 -->
    <script type="module" crossorigin src="js/dist/index.js"></script>
    <script src="yuv-canvas-1.2.6.js"></script>

    <style>
        :root {
            color-scheme: dark;
            --yj-canvas: #0F1420;
            --yj-surface: #141B2A;
            --yj-border: #273247;
            --yj-text: #F2F6FC;
            --yj-muted: #AAB7CA;
            --yj-blue: #5A9EFF;
            --yj-cyan: #25D1FF;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: var(--yj-canvas);
        }

        .loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            grid-template-rows: 1fr auto;
            justify-content: center;
            align-items: center;
            padding: 32px;
            overflow: hidden;
            color: var(--yj-text);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", sans-serif;
            background:
                radial-gradient(circle at 50% 42%, rgba(47, 128, 255, .18), transparent 28%),
                radial-gradient(circle at 72% 24%, rgba(0, 194, 255, .08), transparent 24%),
                var(--yj-canvas);
            transition: opacity 200ms cubic-bezier(.2, 0, 0, 1), visibility 200ms;
        }

        .loading::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: .24;
            background-image:
                linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 64px 64px;
            -webkit-mask-image: radial-gradient(circle at center, #000, transparent 74%);
            mask-image: radial-gradient(circle at center, #000, transparent 74%);
        }

        .loading.is-booted { opacity: 0; visibility: hidden; }

        .boot-card {
            position: relative;
            width: min(100%, 430px);
            padding: 34px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
            box-shadow: inset 0 1px rgba(255,255,255,.06), 0 34px 90px rgba(0,0,0,.34);
            backdrop-filter: blur(18px);
        }

        .boot-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
        }

        .boot-brand img { width: 54px; height: 54px; }

        .boot-brand strong {
            display: block;
            margin-bottom: 3px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -.02em;
        }

        .boot-brand span,
        .boot-status,
        .boot-stage small {
            color: var(--yj-muted);
            font-size: 11px;
        }

        .boot-title {
            margin: 0 0 10px;
            font-size: clamp(28px, 7vw, 40px);
            font-weight: 600;
            line-height: 1.08;
            letter-spacing: -.045em;
        }

        .boot-status { margin: 0 0 28px; line-height: 1.6; }

        .boot-stages {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .boot-stage {
            position: relative;
            padding-top: 13px;
            border-top: 2px solid rgba(255,255,255,.10);
        }

        .boot-stage:first-child { border-color: var(--yj-blue); }

        .boot-stage:first-child::before {
            content: "";
            position: absolute;
            top: -2px;
            left: 0;
            width: 38%;
            height: 2px;
            background: linear-gradient(90deg, var(--yj-blue), var(--yj-cyan));
            animation: boot-progress 1.5s ease-in-out infinite alternate;
        }

        .boot-stage small { display: block; white-space: nowrap; }

        .boot-footer {
            position: relative;
            align-self: end;
            color: rgba(170,183,202,.48);
            font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
            font-size: 9px;
            letter-spacing: .10em;
        }

        @keyframes boot-progress {
            from { width: 18%; opacity: .55; }
            to { width: 100%; opacity: 1; }
        }

        @media (max-width: 520px) {
            .loading { padding: 18px; }
            .boot-card { padding: 26px 22px; border-radius: 20px; }
            .boot-stages { grid-template-columns: 1fr 1fr; gap: 14px 8px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading { transition: none; }
            .boot-stage:first-child::before {
                width: 100%;
                opacity: .75;
                animation: none;
            }
        }
    </style>

</head>

<body>
<div class="loading" role="status" aria-live="polite">
    <div class="boot-card">
        <div class="boot-brand">
            <img src="icons/Icon-192.png" alt="">
            <div><strong>蓝鲸银河</strong><span>YINHE SECURE WEB CLIENT</span></div>
        </div>
        <h1 class="boot-title">正在建立安全连接环境</h1>
        <p class="boot-status">正在验证企业节点并准备端到端加密组件，请稍候。</p>
        <div class="boot-stages" aria-hidden="true">
            <div class="boot-stage"><small>验证环境</small></div>
            <div class="boot-stage"><small>发现节点</small></div>
            <div class="boot-stage"><small>建立通道</small></div>
            <div class="boot-stage"><small>呈现画面</small></div>
        </div>
    </div>
    <p class="boot-footer">PRIVATE INFRASTRUCTURE · END-TO-END ENCRYPTED</p>
</div>
<noscript>蓝鲸银河 Web Client 需要启用 JavaScript 才能运行。</noscript>
<!-- This script installs service_worker.js to provide PWA functionality to
     application. For more information, see:
     https://developers.google.com/web/fundamentals/primers/service-workers -->
<script>
    var serviceWorkerVersion = '20260722-p0-1';
    var scriptLoaded = false;

    function loadMainDartJs() {
        if (scriptLoaded) {
            return;
        }
        scriptLoaded = true;
        var scriptTag = document.createElement('script');
        scriptTag.src = 'main.dart.js';
        scriptTag.type = 'application/javascript';
        scriptTag.addEventListener('load', function () {
            var loading = document.querySelector('.loading');
            if (!loading) return;
            loading.classList.add('is-booted');
            setTimeout(function () { loading.remove(); }, 260);
        });
        document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
        // Service workers are supported. Use them.
        window.addEventListener('load', function () {
            // Wait for registration to finish before dropping the <script> tag.
            // Otherwise, the browser will load the script multiple times,
            // potentially different versions.
            var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
            navigator.serviceWorker.register(serviceWorkerUrl)
                .then((reg) => {
                    function waitForActivation(serviceWorker) {
                        serviceWorker.addEventListener('statechange', () => {
                            if (serviceWorker.state == 'activated') {
                                console.log('Installed new service worker.');
                                loadMainDartJs();
                            }
                        });
                    }

                    if (!reg.active && (reg.installing || reg.waiting)) {
                        // No active web worker and we have installed or are installing
                        // one for the first time. Simply wait for it to activate.
                        waitForActivation(reg.installing || reg.waiting);
                    } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
                        // When the app updates the serviceWorkerVersion changes, so we
                        // need to ask the service worker to update.
                        console.log('New service worker available.');
                        reg.update();
                        waitForActivation(reg.installing);
                    } else {
                        // Existing service worker is still good.
                        console.log('Loading app from service worker.');
                        loadMainDartJs();
                    }
                });

            // If service worker doesn't succeed in a reasonable amount of time,
            // fallback to plaint <script> tag.
            setTimeout(() => {
                if (!scriptLoaded) {
                    console.warn(
                        'Failed to load app from service worker. Falling back to plain <script> tag.',
                    );
                    loadMainDartJs();
                }
            }, 4000);
        });
    } else {
        // Service workers not supported. Just drop the <script> tag.
        loadMainDartJs();
    }
</script>
<!-- 已移除上游的 Firebase Analytics：它会把使用数据外呼到 rustdesk.firebaseapp.com
     （上游的 Firebase 项目），与本产品"私有基础设施、数据不出域"的定位直接冲突，
     在内网/隔离部署下还会因外网不可达而拖慢首屏。 -->
</body>

</html>
